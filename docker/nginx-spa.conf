server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — any unknown path falls back to
    # index.html instead of nginx's own 404, matching the Vercel `rewrites`
    # rule this replaces (see */vercel.json).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache
    # forever; index.html itself must always be revalidated so deploys take
    # effect immediately.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
